<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>জান্নাতুল তাসফিয়া</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px;min-height:100vh;background:linear-gradient(140deg,#f2eaff,#fff0f6);font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#29213d}main{max-width:650px;margin:auto}.hero{text-align:center;padding:18px}.hero h1{color:#6745d8;font-size:clamp(25px,6vw,38px)}.card{background:white;border:1px solid #e9defa;border-radius:23px;padding:23px;box-shadow:0 12px 35px #50318b12}.muted{color:#777086;line-height:1.7}.btn,.opt{font:inherit;border:0;border-radius:13px;padding:14px;cursor:pointer}.btn{background:#704ce6;color:white;font-weight:800;width:100%;margin-top:15px}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e8e1f2;margin:9px 0;color:#29213d}.opt.sel{background:#f1ebff;border:2px solid #704ce6}.hidden{display:none}.progress{height:8px;background:#eee8f7;border-radius:10px;margin:12px 0 22px}.bar{height:8px;background:linear-gradient(90deg,#704ce6,#ff70ae);border-radius:10px;width:0}.q{font-size:21px;font-weight:800;line-height:1.5}.row{display:flex;gap:10px}.row button{flex:1}.secondary{background:#eeeaf5;color:#554b6b}.score{font-size:64px;color:#704ce6;font-weight:900;text-align:center}.field{width:100%;padding:13px;border:1px solid #ddd3ed;border-radius:12px;font:inherit;margin-top:7px}
</style></head><body><main>
<header class="hero"><div style="font-size:38px">💜</div><h1>মোসা:জান্নাতুল তাসফিয়া</h1><p class="muted">দেখি, তুমি আমাকে কতটা ভালোভাবে চেনো! ✨</p></header>
<section class="card" id="intro"><h2 id="introTitle">কে আমাকে সবচেয়ে ভালো চেনে?</h2><p class="muted" id="introText">প্রথমে নিজের উত্তরগুলো বেছে নাও। তারপর বন্ধুকে লিংক পাঠাও। সে উত্তর দিলে তার স্কোর দেখা যাবে।</p><label id="nameLabel">তোমার নাম (ঐচ্ছিক)<input id="creator" class="field" placeholder="তোমার নাম"></label><button class="btn" id="start">চলো শুরু করি 💗</button></section>
<section class="card hidden" id="quiz"><b id="step">প্রশ্ন ১ / ১০</b><div class="progress"><div class="bar" id="bar"></div></div><div class="q" id="question"></div><div id="options"></div><div class="row"><button class="btn secondary" id="back">পেছনে</button><button class="btn" id="next" disabled>পরের প্রশ্ন</button></div></section>
<section class="card hidden" id="result" style="text-align:center"><div style="font-size:40px">🎉</div><h2 id="resultTitle">কুইজ সম্পন্ন!</h2><div class="score" id="score">১০/১০</div><p class="muted" id="resultText"></p><button class="btn" id="copy">শেয়ার লিংক কপি করো 🔗</button><button class="btn secondary" id="again">আবার শুরু</button></section>
<p class="muted" style="text-align:center;font-size:12px">Made with 💜</p></main>
<script>
const BANK=[
["আমার সবচেয়ে পছন্দের রং কোনটি?",["কালো","সাদা","নীল","গোলাপি"]],["আমার প্রিয় খাবার কোনটি?",["বিরিয়ানি","পিজ্জা","ফুচকা","চাইনিজ"]],["অবসরে কী করতে ভালো লাগে?",["গান শুনতে","মুভি দেখতে","বই পড়তে","ঘুরতে যেতে"]],["আমি কোন জায়গা বেশি পছন্দ করি?",["সমুদ্র","পাহাড়","শহর","গ্রাম"]],["আমার পছন্দের ঋতু কোনটি?",["শীত","বর্ষা","গ্রীষ্ম","বসন্ত"]],["আমি কোন ধরনের গান পছন্দ করি?",["রোমান্টিক","ক্লাসিক্যাল","হিন্দি গান","বাংলা গান"]],["আমার প্রিয় পানীয় কী?",["চা","কফি","জুস","কোল্ড ড্রিংকস"]],["আমি রাগ করলে কী করি?",["চুপ থাকি","কথা বলি","একা থাকি","হেসে এড়িয়ে যাই"]],["কোন উপহার আমার ভালো লাগবে?",["ফুল","চকলেট","বই","চিঠি"]],["আমার কাছে কোনটি বেশি গুরুত্বপূর্ণ?",["বিশ্বাস","সময়","ভালোবাসা","সম্মান"]],["আমি কখন বেশি জেগে থাকি?",["সকালে","দুপুরে","রাতে","মাঝরাতে"]],["ছুটির দিন কীভাবে কাটাতে ভালো লাগে?",["বাসায়","বন্ধুদের সঙ্গে","ভ্রমণে","পরিবারের সঙ্গে"]],["আমার পছন্দের আবহাওয়া?",["বৃষ্টি","রোদ","ঠান্ডা","মেঘলা"]],["আমি কোন প্রাণী পছন্দ করি?",["বিড়াল","কুকুর","খরগোশ","পাখি"]],["আমি কোনটি বেশি পছন্দ করি?",["মেসেজ","ফোন","সামনাসামনি কথা","ভিডিও কল"]],["আমার প্রিয় পোশাকের রং?",["হালকা","গাঢ়","কালো","সব রং"]],["ঘুরতে গেলে কী ভালো লাগে?",["ছবি তোলা","খাবার","প্রকৃতি","শপিং"]],["আমার মেজাজ কেমন?",["শান্ত","দুষ্টু","রাগী","লাজুক"]],["কোন সময় মন ভালো থাকে?",["সকাল","বিকেল","সন্ধ্যা","রাত"]],["আমার স্বপ্নের ভ্রমণ কোথায়?",["মালদ্বীপ","কাশ্মীর","লন্ডন","সুইজারল্যান্ড"]]
];
const $=x=>document.getElementById(x);let mode="create",qs=[],ans=[],i=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function enc(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(x){x=x.replace(/-/g,"+").replace(/_/g,"/");while(x.length%4)x+="=";return JSON.parse(decodeURIComponent(escape(atob(x))))}
function page(id){["intro","quiz","result"].forEach(k=>$(k).classList.toggle("hidden",k!==id))}
function render(){let q=qs[i];$("step").textContent=`প্রশ্ন ${i+1} / ১০`;$("bar").style.width=(i+1)*10+"%";$("question").textContent=q.q;$("options").innerHTML="";q.o.forEach((v,j)=>{let b=document.createElement("button");b.className="opt"+(ans[i]===j?" sel":"");b.textContent=["A. ","B. ","C. ","D. "][j]+v;b.onclick=()=>{ans[i]=j;render()};$("options").append(b)});$("back").disabled=i===0;$("next").disabled=ans[i]<0;$("next").textContent=i===9?(mode==="create"?"লিংক তৈরি":"স্কোর দেখো"):"পরের প্রশ্ন"}
function start(){i=0;ans=Array(10).fill(-1);if(mode==="create")qs=shuffle(BANK).slice(0,10).map(x=>({q:x[0],o:shuffle(x[1])}));page("quiz");render()}
$("start").onclick=start;$("back").onclick=()=>{if(i){i--;render()}};
$("next").onclick=()=>{if(i<9){i++;render();return}if(mode==="create"){let p={n:$("creator").value.trim(),q:qs,a:ans};let url=location.href.split("#")[0]+"#quiz="+enc(p);$("resultTitle").textContent="তোমার কুইজ তৈরি!";$("score").textContent="১০/১০";$("resultText").textContent="এই লিংক বন্ধুকে পাঠাও। সে উত্তর দিয়ে নিজের স্কোর দেখতে পারবে।";$("copy").classList.remove("hidden");$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(url);$("copy").textContent="কপি হয়েছে ✓"}catch(e){prompt("লিংক কপি করো",url)}}}else{let n=ans.filter((v,j)=>v===qs[j].a).length;$("resultTitle").textContent="তোমার ফলাফল";$("score").textContent=(n*10)+"%";$("resultText").textContent=`১০টির মধ্যে ${n}টি সঠিক উত্তর! `+ (n>=8?"তুমি আমাকে খুব ভালো চেনো! 💖":n>=5?"বেশ ভালো, আরও জানার আছে! 💜":"আমাকে আরও ভালোভাবে চিনতে হবে! 😊");$("copy").classList.add("hidden")}page("result")};
$("again").onclick=()=>{mode="create";$("introTitle").textContent="কে আমাকে সবচেয়ে ভালো চেনে?";$("introText").textContent="প্রথমে নিজের উত্তরগুলো বেছে নাও। তারপর বন্ধুকে লিংক পাঠাও।";$("nameLabel").classList.remove("hidden");$("start").textContent="চলো শুরু করি 💗";page("intro")};
try{if(location.hash.startsWith("#quiz=")){let p=dec(location.hash.slice(6));if(p.q.length===10){mode="answer";qs=p.q.map((q,j)=>({q:q.q,o:q.o,a:p.a[j]}));$("introTitle").textContent=(p.n||"তাকে")+"-কে তুমি কতটা চেনো?";$("introText").textContent="১০টি প্রশ্নের উত্তর দাও, শেষে তোমার স্কোর দেখাবে।";$("nameLabel").classList.add("hidden");$("start").textContent="উত্তর দেওয়া শুরু করো 💜"}}}catch(e){}
</script></body></html>
